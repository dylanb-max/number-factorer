<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="us-ascii"> <!-- cause im a funny guy who doesnt like utf 8 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cool Number Factoring Tool</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- lowk regret naming calculateButton not a very scalable name -->
  <!-- sadly im lazy :) -->
  <!-- one day i might come back and enhance this with beautiful css but today is not the day -->
  <h1>Number Factoring Tool</h1>
  <input type="text" id="input">
  <button id="calculateButton">Factor!</button>
  <button id="checkPrime">CheckPrime!</button>
  <h2 id="output">[outputs go here]</h2>
  <footer>not vibecoded guys <3</footer>
  <script>
  	let button = document.getElementById("calculateButton"); // also not a great name lmao
    let outputField = document.getElementById("output"); // whatever ill learn
    
    let checkPrimeButton = document.getElementById("checkPrime"); // ooo you like reading comments do you
  	button.addEventListener("click", () => calculateFunct()); // well im gonna stop cause this is VeRy uNpRoFeSsIoNaL >:(
    checkPrimeButton.addEventListener("click", () => checkPrime());
    
    let primeMode = false;
    
    function calculateFunct(){ // no. nothing can contain my whimsy .^.
    	let inputField = document.getElementById("input");
        let num = parseInt(inputField.value, 10);
        if (num > 10000000){
        	outputField.textContent = "Too large. (>10000000)"; // ok il stop
            return;
        }
        if (num <= 0){
        	outputField.textContent = "Positive numbers only!";
            return;
        }
        if (num != num){
        	outputField.textContent = "Bad input. Parsed to int as NaN.";
            return;
        }
        let outputList = [];
        for (let i = 1; i <= num; i++){
            if (num % i == 0){
            	outputList.push(i);
            }
        }
        if (primeMode){
        	if (outputList.length == 2){
               	outputField.textContent = num + " is a prime."
            }
            else {
                outputField.textContent = num + " is composite."
            }
            return;
        }
        outputField.textContent = "The factors of " + num + " are:\n " 									+ outputList;
    }

    // absolutely beautiful logic with this one lmao
    function checkPrime(){
        	primeMode = true;
            calculateFunct(); // cause it reuses a lotta logic ykyk
            primeMode = false;
    }
  </script>
</body>
</html>
